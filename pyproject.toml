[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard"
version = "0.1.0"
description = "DataGuard - Data Quality & Drift Monitoring Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering Team", email = "dataguard@example.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandera>=0.20.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "sqlalchemy>=2.0.0",
    "faker>=25.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
dataguard = "dataguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["dataguard"]
omit = ["*/tests/*", "*/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
show_missing = true
